<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Finance Tracker — Login</title>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box">
    <h1>💰 Finance Tracker</h1>
    <p>Sign in to manage your finances</p>

    <div id="alert" class="alert hidden"></div>

    <!-- Login Form -->
    <div id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="doLogin()">Sign In</button>
      <button class="btn btn-google" onclick="window.location='/api/auth/google'">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>
      <div class="divider">Don't have an account? <a href="#" onclick="toggle()">Register</a></div>
    </div>

    <!-- Register Form -->
    <div id="registerForm" class="hidden">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="John Doe"/>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label>Password <span style="color:var(--muted);font-size:12px">(min 8 chars)</span></label>
        <input type="password" id="regPassword" placeholder="••••••••"/>
      </div>
      <div class="form-group">
        <label>Base Currency</label>
        <select id="regCurrency">
          <option value="USD">USD — US Dollar</option>
          <option value="EUR">EUR — Euro</option>
          <option value="GBP">GBP — British Pound</option>
          <option value="INR" selected>INR — Indian Rupee</option>
          <option value="JPY">JPY — Japanese Yen</option>
          <option value="CAD">CAD — Canadian Dollar</option>
          <option value="AUD">AUD — Australian Dollar</option>
        </select>
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="doRegister()">Create Account</button>
      <button class="btn btn-google" onclick="window.location='/api/auth/google'">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Continue with Google
      </button>
      <div class="divider">Already have an account? <a href="#" onclick="toggle()">Sign In</a></div>
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
  // Redirect if already logged in
  if (api.getToken()) window.location = '/dashboard.html';

  function toggle() {
    document.getElementById('loginForm').classList.toggle('hidden');
    document.getElementById('registerForm').classList.toggle('hidden');
    showAlert('', '');
  }

  function showAlert(msg, type) {
    const el = document.getElementById('alert');
    el.className = `alert ${type ? 'alert-' + type : 'hidden'}`;
    el.textContent = msg;
  }

  async function doLogin() {
    const email    = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    if (!email || !password) return showAlert('Please fill all fields', 'error');
    try {
      const data = await api.post('/auth/login', { email, password });
      api.setToken(data.token);
      window.location = '/dashboard.html';
    } catch (e) { showAlert(e.message, 'error'); }
  }

  async function doRegister() {
    const name     = document.getElementById('regName').value.trim();
    const email    = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPassword').value;
    const currency = document.getElementById('regCurrency').value;
    if (!name || !email || !password) return showAlert('Please fill all fields', 'error');
    try {
      const data = await api.post('/auth/register', { name, email, password, currency });
      api.setToken(data.token);
      window.location = '/dashboard.html';
    } catch (e) { showAlert(e.message, 'error'); }
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (!document.getElementById('loginForm').classList.contains('hidden')) doLogin();
      else doRegister();
    }
  });
</script>
</body>
</html>
