<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Signing in...</title>
  <link rel="stylesheet" href="/css/main.css"/>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-box" style="text-align:center">
    <h1>✅ Signed in!</h1>
    <p>Redirecting to your dashboard...</p>
  </div>
</div>
<script src="/js/api.js"></script>
<script>
  // token is set by api.js on load from URL ?token=...
  if (api.getToken()) {
    setTimeout(() => window.location = '/dashboard.html', 800);
  } else {
    window.location = '/index.html?error=oauth_failed';
  }
</script>
</body>
</html>
