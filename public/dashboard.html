<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — Finance Tracker</title>
  <link rel="stylesheet" href="/css/main.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
<script src="/js/api.js"></script>
<script src="/js/nav.js"></script>

<main>
<div class="container">

  <!-- Summary Cards -->
  <div class="grid-4" id="summaryCards">
    <div class="card"><div class="card-title">This Month Income</div><div class="card-value income" id="cardIncome">—</div></div>
    <div class="card"><div class="card-title">This Month Expenses</div><div class="card-value expense" id="cardExpense">—</div></div>
    <div class="card"><div class="card-title">Net Savings</div><div class="card-value savings" id="cardSavings">—</div></div>
    <div class="card"><div class="card-title">Savings Rate</div><div class="card-value" id="cardRate" style="color:var(--primary)">—</div></div>
  </div>

  <!-- Charts Row -->
  <div class="grid-2">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <strong>Income vs Expenses (6 months)</strong>
      </div>
      <canvas id="trendChart" height="220"></canvas>
    </div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <strong>Expense Breakdown</strong>
      </div>
      <canvas id="donutChart" height="220"></canvas>
    </div>
  </div>

  <!-- Budgets overview -->
  <div class="grid-2">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <strong>Budget Progress</strong>
        <a href="/budgets.html" style="font-size:13px;color:var(--primary)">View all →</a>
      </div>
      <div id="budgetList"><p style="color:var(--muted);font-size:14px">No budgets set.</p></div>
    </div>

    <!-- Recent Transactions -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <strong>Recent Transactions</strong>
        <a href="/transactions.html" style="font-size:13px;color:var(--primary)">View all →</a>
      </div>
      <div id="recentTx"><p style="color:var(--muted);font-size:14px">No transactions yet.</p></div>
    </div>
  </div>

  <!-- Notifications -->
  <div class="card" id="notifCard" style="margin-top:0;display:none">
    <strong>🔔 Notifications</strong>
    <div id="notifList" style="margin-top:12px"></div>
  </div>

</div>
</main>

<script>
let trendChart, donutChart;

const fmt = (n, currency='') => {
  const num = parseFloat(n) || 0;
  return (currency ? currency + ' ' : '') + num.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};

async function loadDashboard() {
  const [data, txData, notifs] = await Promise.all([
    api.get('/dashboard/summary'),
    api.get('/transactions?limit=5'),
    api.get('/notifications'),
  ]);

  const cm = data.current_month;
  document.getElementById('cardIncome').textContent  = fmt(cm.income);
  document.getElementById('cardExpense').textContent = fmt(cm.expense);
  document.getElementById('cardSavings').textContent = fmt(cm.savings);
  document.getElementById('cardRate').textContent    = cm.savings_rate + '%';

  buildTrendChart(data.trend);
  buildDonutChart(data.expense_breakdown);
  buildBudgets(data.budgets);
  buildRecentTx(txData.transactions || []);
  buildNotifs(notifs);
}

function buildTrendChart(trend) {
  const labels  = trend.map(t => t.month);
  const incomes  = trend.map(t => t.income  || 0);
  const expenses = trend.map(t => t.expense || 0);
  if (trendChart) trendChart.destroy();
  trendChart = new Chart(document.getElementById('trendChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Income',  data: incomes,  backgroundColor: '#10b98166', borderColor: '#10b981', borderWidth: 2, borderRadius: 4 },
        { label: 'Expense', data: expenses, backgroundColor: '#ef444466', borderColor: '#ef4444', borderWidth: 2, borderRadius: 4 },
      ],
    },
    options: { responsive: true, plugins: { legend: { position: 'bottom' } }, scales: { y: { beginAtZero: true } } },
  });
}

function buildDonutChart(breakdown) {
  if (!breakdown.length) return;
  const labels = breakdown.map(b => b.category || 'Other');
  const values = breakdown.map(b => b.total);
  const colors = ['#4f46e5','#10b981','#ef4444','#f59e0b','#06b6d4','#8b5cf6','#ec4899','#14b8a6'];
  if (donutChart) donutChart.destroy();
  donutChart = new Chart(document.getElementById('donutChart'), {
    type: 'doughnut',
    data: { labels, datasets: [{ data: values, backgroundColor: colors, borderWidth: 2 }] },
    options: { responsive: true, plugins: { legend: { position: 'bottom' } } },
  });
}

function buildBudgets(budgets) {
  const el = document.getElementById('budgetList');
  if (!budgets.length) return;
  el.innerHTML = budgets.map(b => {
    const pct = b.progress_pct || 0;
    const barClass = b.is_over_budget ? 'over' : pct >= b.alert_at_pct ? 'warn' : '';
    return `
      <div style="margin-bottom:14px">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px">
          <span>${b.category_icon || ''} ${b.category_name}</span>
          <span style="color:var(--muted)">${fmt(b.spent)} / ${fmt(b.amount)}</span>
        </div>
        <div class="progress">
          <div class="progress-bar ${barClass}" style="width:${Math.min(pct,100)}%"></div>
        </div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${pct}% used${b.is_over_budget ? ' ⚠️ Over budget!' : ''}</div>
      </div>`;
  }).join('');
}

function buildRecentTx(txs) {
  const el = document.getElementById('recentTx');
  if (!txs.length) return;
  el.innerHTML = txs.map(t => `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-size:14px">${t.category_icon || '💳'} ${t.description || t.category_name || '—'}</div>
        <div style="font-size:12px;color:var(--muted)">${t.date}</div>
      </div>
      <span style="font-weight:600;color:${t.type==='income'?'var(--success)':'var(--danger)'}">
        ${t.type==='income'?'+':'−'}${fmt(Math.abs(t.amount))} ${t.currency}
      </span>
    </div>`).join('');
}

function buildNotifs(notifs) {
  const unread = notifs.filter(n => !n.is_read);
  if (!unread.length) return;
  document.getElementById('notifCard').style.display = 'block';
  document.getElementById('notifList').innerHTML = unread.map(n => `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;padding:10px;background:var(--bg);border-radius:6px;margin-bottom:8px">
      <div>
        <div style="font-size:14px;font-weight:500">${n.title}</div>
        <div style="font-size:13px;color:var(--muted)">${n.message || ''}</div>
      </div>
      <button class="btn btn-outline btn-sm" onclick="markRead('${n.id}',this)">✓</button>
    </div>`).join('');
}

async function markRead(id, btn) {
  await api.put(`/notifications/${id}/read`);
  btn.closest('div[style]').remove();
}

loadDashboard();
</script>
</body>
</html>
